<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brick Breaker</title>
    <link href="css/style.css" rel="stylesheet">
    <style>
        .menu button, .winMenu button, .loseMenu button {
            display: block;
            margin: 10px auto;
            padding: 10px 20px;
            font-family: inherit;
            background: #fff;
            border: 2px solid #000;
            cursor: pointer;
            font-weight: bold;
        }
        .menu button:hover, .winMenu button:hover, .loseMenu button:hover {
            background: #ddd;
        }
        /* Zid hado bach t-optimiser performance */
        .user, .ball, .block {
            will-change: transform; 
        }
    </style>
</head>
<body>

    <div class="bg2">
        <div id="game-container">
            <div class="test">
                <div class="title">BRICK BREAKER</div>
            </div>

            <div id="instruction">
                <h3 class="text">- Press "S" to Start</h3>
                <h3 class="text">- Use Arrows < and > to Move</h3>
                <h3 class="text">- Press "P" to Pause</h3>
            </div>

            <div id="counters">
                <span id="score">Score: 0</span>
                <span id="count">Timer: 0s</span>
                <span id="lives">Lives: 3</span>
            </div>

            <div class="grid">                
                <div class="menu" id="pauseMenu" style="display: none;">
                    <h2>PAUSED</h2>
                    <button id="btnContinue">Continue</button>
                    <button id="btnRestart">Restart</button>
                </div>

                <div class="winMenu" id="winMenu" style="display: none;">
                    <h2>YOU WIN!</h2>
                    <p id="finalScoreWin"></p>
                    <button id="btnRestartWin">Play Again</button>
                </div>
                <div class="loseMenu" id="loseMenu" style="display: none;">
                    <h2>GAME OVER</h2>
                    <button id="btnRestartLose">Try Again</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="js/music.mp3" type="audio/mpeg">
    </audio>

    <script type="module" src="js/app.js" defer ></script>
</body>
</html>
